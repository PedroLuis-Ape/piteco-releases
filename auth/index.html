<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Entrar no Piteco</title>
<style>
  :root { color-scheme: light dark; --azul: #0082fb; --fundo: #f4f7fb; --texto: #14202e; --suave: #5b6b7d; --cartao: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0f1720; --texto: #eef3f8; --suave: #a9b6c4; --cartao: #182330; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 440px; background: var(--cartao); border-radius: 20px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 24px; margin: 14px 0 6px; }
  p { margin: 8px 0; color: var(--suave); }
  .botao { display: block; margin: 22px 0 10px; padding: 16px 20px; border-radius: 14px; background: var(--azul); color: #fff; font-size: 20px; font-weight: 700; text-decoration: none; }
  .botao[hidden] { display: none; }
  .aviso { color: #c0392b; font-weight: 600; }
  small { display: block; margin-top: 14px; color: var(--suave); font-size: 14px; }
</style>
</head>
<body>
<main>
  <img src="logo.png" alt="Piteco">
  <h1 id="titulo">Entrar no Piteco</h1>
  <p id="mensagem">Toque no botão para abrir o Piteco já com a sua conta.</p>
  <a id="abrir" class="botao" href="#">Abrir o Piteco</a>
  <small id="ajuda">Se o navegador perguntar se pode abrir o Piteco, aceite. Abra este e-mail no mesmo aparelho em que quer entrar.</small>
</main>
<script>
  // The sign-in result arrives after "#", which never leaves this browser: this page sends nothing anywhere. It only
  // hands it to the Piteco app through a button the person taps (browsers only open an app on a real tap).
  (function () {
    var fragmento = location.hash.slice(1);
    var dados = new URLSearchParams(fragmento);
    var botao = document.getElementById("abrir");
    var mensagem = document.getElementById("mensagem");
    if (fragmento) history.replaceState(null, "", location.pathname);
    botao.href = "piteco://auth/callback" + (fragmento ? "#" + fragmento : "");
    if (dados.get("error") || dados.get("error_code")) {
      document.getElementById("titulo").textContent = "O link não vale mais";
      mensagem.className = "aviso";
      mensagem.textContent = /expired|invalid/i.test(dados.get("error_code") + " " + dados.get("error_description"))
        ? "Este link do e-mail expirou ou já foi usado. No Piteco, peça um e-mail novo e use o link mais recente."
        : "O login não deu certo. No Piteco, peça um e-mail novo.";
      botao.hidden = true;
    } else if (!dados.get("access_token")) {
      mensagem.textContent = "Esta página é a volta do login do Piteco. Abra o link do e-mail que o Piteco mandou.";
      botao.hidden = true;
    }
  })();
</script>
</body>
</html>
